[build]
  command = "npm run build"
  publish = "dist"

# Revalidate the entry page so it loads the current hashed game bundle.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
